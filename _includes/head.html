  <!-- DEPLOYMENT INSTRUCTIONS (keep this comment):
       1. (Optional) Generate professional 1-2 page CV (Canva, Word, LaTeX, Google Docs → Export PDF).

          Note: Download CV buttons are currently removed from the UI (easy to re-add later).
       3. (Optional) Replace images/profile.jpg with updated headshot (square, ~1000px, face-centered).

          - Exact size: 1200 × 630 px (PNG or JPG)
          - Recommended content: Clean, minimal card with:
            - Your name (large)
            - "Systems Engineer @ KLA | Physicist"
            - 2-3 key highlights (e.g. "nm-scale e-beam metrology", "ML for nanophotonics", "ACS Photonics author")
            - Subtle dark or light background that matches the site aesthetic
          - Save as `images/social-preview.jpg`
          - Update the `og:image` and Twitter image meta tags below
       5. git add index.html Daniele_De_Gregorio_CV.pdf images/profile.jpg images/social-preview.jpg
       6. Commit + push to main. GitHub Pages auto-deploys (Settings → Pages → Source: main / root).
       7. Hard-refresh https://masterdanny.github.io after ~60s.
       Safe to delete css/, js/, and old images (hubble.jpg, austria.jpeg, msc.png) after verification.
       Update social links in footer if GitHub or X handle changes.

  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        var light = t === 'light' || (!t && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.classList.toggle('light', light);
        document.documentElement.classList.toggle('dark', !light);
      } catch (e) {}
    })();
  </script>

  {% include styles.html %}

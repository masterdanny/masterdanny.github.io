{% assign blog_active = false %}

  {% assign blog_active = true %}
{% endif %}
  <!-- NAVBAR -->
  <nav class="no-print fixed top-0 left-0 right-0 z-50 border-b border-slate-800/80 glass">
    <div class="max-w-7xl mx-auto px-5 sm:px-6">
      <div class="flex items-center justify-between h-16">
        <!-- Logo -->
        <a href="{{ '/' | relative_url }}" class="flex items-center gap-x-2.5 sm:gap-x-3 group">
          <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-gradient-to-br from-teal-400 to-cyan-400 flex items-center justify-center flex-shrink-0">
            <span class="text-slate-950 font-semibold text-lg sm:text-xl tracking-[-1.5px] font-display">DD</span>
          </div>
          <div class="min-w-0">
            <div class="font-semibold tracking-tight text-base sm:text-lg truncate">Daniele De Gregorio</div>
            <div class="text-[9.5px] sm:text-[10px] text-slate-500 -mt-0.5 sm:-mt-1 truncate">Systems Engineer &amp; Physicist</div>
          </div>
        </a>

        <div class="flex items-center gap-x-3 sm:gap-x-4">
          <a href="{{ '/blog/' | relative_url }}" class="nav-link text-slate-300 hover:text-slate-100 px-2 py-1.5 text-sm{% if blog_active %} active{% endif %}">Blog</a>

          <a href="mailto:d.degregorio95@gmail.com"
             class="hidden sm:inline-flex items-center gap-x-2 rounded-full border border-slate-700 hover:border-teal-400/60 px-4 py-1.5 text-xs font-medium transition-colors hover:text-teal-300">
            <i class="fa-solid fa-envelope text-teal-400"></i>
            <span>Get in touch</span>
          </a>

          <button id="theme-toggle"
                  class="w-10 h-10 flex items-center justify-center rounded-full border border-slate-700 hover:border-slate-500 text-slate-400 hover:text-slate-200 transition-colors"
                  aria-label="Toggle dark mode">
            <i class="fa-solid fa-moon text-sm dark:hidden"></i>
            <i class="fa-solid fa-sun text-sm hidden dark:block"></i>
          </button>
        </div>
      </div>
    </div>

  <!-- Toast container -->
  <div id="toast-container" class="no-print fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] hidden">
    <div class="toast bg-slate-900 border border-slate-700 text-sm rounded-2xl shadow-2xl px-5 py-3 flex items-center gap-x-3">
      <i class="fa-solid fa-check text-emerald-400"></i>
      <span>Email address copied to clipboard</span>
    </div>
  </div>

  <script>
    // Tailwind config
    function initTailwind() {
      document.querySelectorAll('script').forEach(s => {
        if (s.src && s.src.includes('tailwindcss')) {
          // Already loaded via CDN
        }
      });

      // Run play CDN config
      if (typeof tailwind !== 'undefined') {
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: {
                display: ['Space Grotesk', 'Inter', 'system-ui', 'sans-serif']
              }
            }
          }
        };
      }
    }

    // Theme Toggle (Dark / Light)
    function initThemeToggle() {
      const html = document.documentElement;
      const toggles = [
        document.getElementById('theme-toggle'),
        document.getElementById('theme-toggle-mobile')
      ].filter(Boolean);

      function setTheme(isLight) {
        if (isLight) {
          html.classList.add('light');
          html.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        } else {
          html.classList.remove('light');
          html.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        }
      }

      // Initialize theme
      const savedTheme = localStorage.getItem('theme');
      const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;

      if (savedTheme === 'light' || (!savedTheme && prefersLight)) {
        setTheme(true);
      } else {
        setTheme(false);
      }

      // Attach listeners
      toggles.forEach(toggle => {
        toggle.addEventListener('click', () => {
          const isCurrentlyLight = html.classList.contains('light');
          setTheme(!isCurrentlyLight);
        });
      });
    }

    // Mobile menu
    function initMobileMenu() {
      const btn = document.getElementById('mobile-menu-btn');
      const menu = document.getElementById('mobile-menu');
      if (!btn || !menu) return;
      const links = menu.querySelectorAll('a');

      btn.addEventListener('click', () => {
        const isOpen = !menu.classList.contains('hidden');
        if (isOpen) {
          menu.classList.add('hidden');
          btn.innerHTML = '<i class="fa-solid fa-bars text-xl"></i>';
          btn.setAttribute('aria-expanded', 'false');
        } else {
          menu.classList.remove('hidden');
          btn.innerHTML = '<i class="fa-solid fa-times text-xl"></i>';
          btn.setAttribute('aria-expanded', 'true');
        }
      });

      links.forEach(link => {
        link.addEventListener('click', () => {
          menu.classList.add('hidden');
          btn.innerHTML = '<i class="fa-solid fa-bars text-xl"></i>';
          btn.setAttribute('aria-expanded', 'false');
        });
      });

      // Close on escape
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !menu.classList.contains('hidden')) {
          menu.classList.add('hidden');
          btn.innerHTML = '<i class="fa-solid fa-bars text-xl"></i>';
          btn.setAttribute('aria-expanded', 'false');
        }
      });
    }

    // Copy email with toast
    function copyEmail() {
      const email = 'd.degregorio95@gmail.com';
      navigator.clipboard.writeText(email).then(() => {
        const container = document.getElementById('toast-container');
        container.classList.remove('hidden');
        container.classList.add('flex');

        setTimeout(() => {
          container.classList.remove('flex');
          container.classList.add('hidden');
        }, 2600);
      }).catch(() => {
        // Fallback
        window.location.href = 'mailto:' + email;
      });
    }

    // Scrollspy for nav
    function initScrollspy() {
      const sections = ['about', 'experience', 'education', 'work', 'contact'];
      const navLinks = document.querySelectorAll('nav a[href^="#"]');
      const mobileLinks = document.querySelectorAll('.mobile-nav-link');

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const id = entry.target.id;

            // Desktop
            navLinks.forEach(link => {
              link.classList.remove('active');
              if (link.getAttribute('href') === `#${id}`) {
                link.classList.add('active');
              }
            });

            // Mobile
            mobileLinks.forEach(link => {
              link.classList.remove('text-white', 'font-medium');
              if (link.getAttribute('href') === `#${id}`) {
                link.classList.add('text-white', 'font-medium');
              }
            });
          }
        });
      }, {
        rootMargin: window.innerWidth < 768 ? '-20% 0px -45% 0px' : '-30% 0px -55% 0px',
        threshold: 0.08
      });

      sections.forEach(id => {
        const el = document.getElementById(id);
        if (el) observer.observe(el);
      });
    }

    // Scroll reveal
    function initReveals() {
      const reveals = document.querySelectorAll('.premium-card, #about .prose, .work-card');

      const io = new IntersectionObserver((entries) => {
        entries.forEach((entry, index) => {
          if (entry.isIntersecting) {
            setTimeout(() => {
              entry.target.classList.add('reveal', 'visible');
            }, index * 70);
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });

      reveals.forEach(el => {
        el.classList.add('reveal');
        io.observe(el);
      });
    }

    // Footer year
    function initYear() {
      const year = document.getElementById('year');
      if (year) year.textContent = new Date().getFullYear();
    }

    // Smooth scroll for all anchor links (progressive enhancement)
    function initSmoothScroll() {
      document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
          const target = document.querySelector(this.getAttribute('href'));
          if (target) {
            e.preventDefault();
            const navHeight = 64;
            const top = target.getBoundingClientRect().top + window.scrollY - navHeight;
            window.scrollTo({ top, behavior: 'smooth' });

            // Update URL without jump
            history.pushState(null, null, this.getAttribute('href'));
          }
        });
      });
    }

    // Keyboard accessibility niceties
    function initA11y() {
      // Focus ring visible only on keyboard
      document.body.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') document.body.classList.add('keyboard-user');
      });
    }

    // Main init
    function init() {
      initTailwind();
      initThemeToggle();
      initMobileMenu();
      if (document.getElementById('about')) {
        initScrollspy();
        initSmoothScroll();
      }
      initReveals();
      initYear();
      initA11y();

      // Easter egg: Konami code for very subtle tech glow (harmless)
      let konami = '';
      const sequence = '38384040373937396665'; // up up down down left right left right b a
      document.addEventListener('keydown', (e) => {
        konami += e.keyCode;
        if (konami.length > sequence.length) konami = konami.slice(1);
        if (konami === sequence) {
          document.querySelectorAll('.premium-card').forEach(c => c.style.borderColor = '#14b8a6');
          setTimeout(() => {
            document.querySelectorAll('.premium-card').forEach(c => c.style.borderColor = '');
          }, 1400);
          konami = '';
        }
      });
    }

    // Boot
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
